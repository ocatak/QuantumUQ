[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "quantumuq"
version = "0.4.1"
description = "Uncertainty Quantification for Quantum Machine Learning (PennyLane & Qiskit)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.13"
authors = [
  { name = "Ozgur Catak", email = "f.ozgur.catak@uis.no" },
]
keywords = [
  "quantum",
  "quantum-computing",
  "quantum-machine-learning",
  "qml",
  "uncertainty-quantification",
  "calibration",
  "shot-noise",
  "reliability",
  "benchmarking",
  "pennylane",
  "qiskit",
  "trustworthy-ai",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.22",
]

[project.optional-dependencies]
docs = [
  "mkdocs>=1.5",
  "mkdocs-material>=9.0",
]
dev = [
  "pytest>=7.0",
  "ruff>=0.5.0",
  "black>=24.0.0",
  "mypy>=1.8.0",
  "jupyter>=1.0.0",
  "pennylane>=0.35",
  "qiskit>=1.0.0,<3",
  "scikit-learn>=1.3",
]
aer = [
  "qiskit-aer>=0.13,<1",
]
benchmarks = [
  "scikit-learn>=1.3",
]

[project.urls]
Homepage = "https://github.com/ocatak/QuantumUQ"
Documentation = "https://quantumuq.readthedocs.io/"
Repository = "https://github.com/ocatak/QuantumUQ"
Issues = "https://github.com/ocatak/QuantumUQ/issues"
Changelog = "https://github.com/ocatak/QuantumUQ/blob/main/CHANGELOG.md"

[project.scripts]
quantumuq-smoke = "examples.scripts.run_smoke_examples:main"
quantumuq-benchmark = "quantumuq.benchmarks.cli:main"

[tool.hatch.build.targets.sdist]
include = [
  "/quantumuq",
  "/examples",
  "/docs",
]

[tool.hatch.build.targets.wheel]
include = [
  "/quantumuq",
  "/examples/scripts",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E203", "E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict_optional = false
disallow_untyped_defs = false

